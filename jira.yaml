Kart 2 – Fiziksel Node PoC
Tasklar
ipmitool image'ının hazırlanması
Tek node üzerinde PoC çalıştırılması
Vendor bilgisinin alınması
Model bilgisinin alınması
BMC/iLO IP bilgilerinin alınması
JSON çıktısının oluşturulması
ipmitool ile seri numarası bilgilerinin analiz edilmesi
Çıktı
Fiziksel node envanteri başarıyla toplanmıştır.
Vendor, model ve BMC/iLO IP bilgileri elde edilmiştir.
Gerçek fiziksel seri numarası ipmitool ile alınamamaktadır.
Gerçek seri numarasının Redfish/Cisco API üzerinden alınmasına karar verilmiştir.
